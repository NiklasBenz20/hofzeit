<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hofzeit · Harzerhof</title>
<meta name="theme-color" content="#0b0906">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hofzeit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1vQT2zibXGY4WCwTOlSPalPiSsR1pUpIP=s192">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1vQT2zibXGY4WCwTOlSPalPiSsR1pUpIP=s180">
<style>
html,body{margin:0;height:100%;background:#0b0906;overflow:hidden;overscroll-behavior:none}
#top{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0);background:#0b0906;z-index:3}
#app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0);width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#0b0906;display:block}
#ld{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#2a2014 0,#0b0906 60%);transition:opacity .6s ease}
#ld img{width:104px;height:104px;border-radius:26px;box-shadow:0 0 50px rgba(214,169,78,.35);animation:p 1.8s ease-in-out infinite}
#ld b{display:block;margin-top:18px;text-align:center;font:600 15px/1.2 -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.2em;color:#d6a94e}
@keyframes p{50%{transform:scale(1.06)}}
.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="top"></div>
<div id="ld"><div><img src="https://lh3.googleusercontent.com/d/1vQT2zibXGY4WCwTOlSPalPiSsR1pUpIP=s208" alt=""><b>HOFZEIT</b></div></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwNbKMkJrxn_Z8eowaeZnr4K9GXI1ASz_c0uOOfVWWiivPCYuyOXDnhJDi68XhZlGGB/exec" title="Hofzeit" allow="clipboard-write; fullscreen"></iframe>
<script>
(function(){
  var f=document.getElementById('app'),l=document.getElementById('ld');
  function hide(){l.classList.add('gone');}
  f.addEventListener('load',function(){setTimeout(hide,1200);});
  setTimeout(hide,12000);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
</body>
</html>
